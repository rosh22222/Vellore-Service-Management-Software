services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vfe_service
      POSTGRES_USER: vfe
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "5432:5432"
    volumes:
      - vfe_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfe -d vfe_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vfe_postgres:
